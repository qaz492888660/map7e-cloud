name: Gateway public verification
on:
  push:
    branches: [feat/quark-media-gateway]
    paths: [.github/workflows/gateway-public-verify.yml]
permissions:
  contents: read
jobs:
  public-http:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify public HTTP status and deployed version
        shell: bash
        run: |
          set -euo pipefail
          health_status=$(curl --max-time 30 -sS -o /tmp/health-body -w "%{http_code}" https://media.map7e.com/health)
          media_status=$(curl --max-time 30 -sS -o /tmp/media-body -w "%{http_code}" https://media.map7e.com/v1/media)
          echo "HEALTH_HTTP=$health_status"
          cat /tmp/health-body
          echo
          echo "MEDIA_HTTP=$media_status"
          cat /tmp/media-body
          echo
          test "$health_status" = 200
          test "$media_status" = 401
          jq -e '.ok == true and .version == "0.2.10"' /tmp/health-body
          jq -e '.ok == false and .error == "media_ticket_invalid"' /tmp/media-body
