name: Run admin bootstrap once

on:
  push:
    branches: [main]

jobs:
  bootstrap:
    if: github.event.head_commit.message == 'Run one-time admin bootstrap'
    runs-on: ubuntu-latest
    steps:
      - name: Call production bootstrap endpoint
        shell: bash
        run: |
          set -euo pipefail
          url="https://map7e-cloud.vercel.app/api/admin-bootstrap-once"
          for attempt in $(seq 1 60); do
            body="$(curl -fsS "$url" || true)"
            if printf '%s' "$body" | grep -q '"ok":true'; then
              printf '%s
' "$body"
              exit 0
            fi
            sleep 5
          done
          echo "Bootstrap endpoint did not return ok=true" >&2
          exit 1
