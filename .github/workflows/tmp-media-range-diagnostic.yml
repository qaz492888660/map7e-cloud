name: Temporary MP4 Gateway diagnostic
on:
  pull_request:
    types: [synchronize]
    paths: ['.github/workflows/tmp-media-range-diagnostic.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read Production and Gateway range responses without credentials in logs
        shell: bash
        run: |
          python3 - <<'PY'
          import json, datetime, urllib.request, urllib.error
          BASE = "https://cloud.map7e.com/api/storage-download?storageId=quark-main&id=~1YXUn3IxunIIj3GKhIe1I6SbsqFTdSQzHYbspOlQHD-jsYf45qdT9lgNwVx83j6AkupAhwoWwvsK-pO6xrKTT80%7CDBA5IEZyssk&parentId=~1-mb9uDpD06YJvVx9wAkMIuwAwb0PLTfK800XKZUUwpeRXrW0kc_A9zLbU93UZw4wxze1Cu9anGLr_upz8nSXLc%7C7rMLpooj6bk"
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          opener = urllib.request.build_opener(NoRedirect)
          allowed = ["accept-ranges", "content-range", "content-length", "content-type", "cf-ray", "date"]
          def request(label, url, method="GET", range_header=None):
              headers = {"Accept": "*/*"}
              if range_header: headers["Range"] = range_header
              req = urllib.request.Request(url, headers=headers, method=method)
              try:
                  response = opener.open(req, timeout=25)
              except urllib.error.HTTPError as error:
                  response = error
              except Exception as error:
                  print(json.dumps({"label":label,"time":datetime.datetime.now(datetime.timezone.utc).isoformat(),"transportErrorType":type(error).__name__}))
                  return None, None
              with response:
                  result = {"label":label,"time":datetime.datetime.now(datetime.timezone.utc).isoformat(),"method":method,"status":response.code,"headers":{key:response.headers.get(key) for key in allowed if response.headers.get(key)}}
                  if range_header: result["range"] = range_header
                  if response.code >= 400 or label == "production_check_range":
                      body = response.read(2048)
                      try:
                          data = json.loads(body)
                          result["body"] = {key:data[key] for key in ["ok","error","rangeSupported","status","acceptRanges","contentRange","contentType","contentLength","totalLength"] if key in data}
                      except Exception:
                          result["bodyFormat"] = "non-json"
                  location = response.headers.get("Location")
                  print(json.dumps(result))
                  return response.code, location
          request("production_check_range", BASE+"&check=range")
          status, ticket_url = request("production_ticket_redirect", BASE+"&inline=1")
          if status == 302 and ticket_url:
              parsed = urllib.parse.urlsplit(ticket_url)
              if parsed.scheme == "https" and parsed.hostname == "media.map7e.com" and parsed.path == "/v1/media":
                  request("gateway_head_first_byte", ticket_url, "HEAD", "bytes=0-0")
                  request("gateway_get_first_1024", ticket_url, "GET", "bytes=0-1023")
                  request("gateway_get_middle_1024", ticket_url, "GET", "bytes=400000000-400001023")
              else:
                  print(json.dumps({"error":"unexpected_gateway_destination"}))
          ticket_url = None
          PY
