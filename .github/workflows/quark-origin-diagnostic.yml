name: Temporary Quark origin diagnostic
on:
  push:
    branches: [feat/quark-media-gateway]
    paths: [.github/workflows/quark-origin-diagnostic.yml]
permissions:
  contents: read
  id-token: write
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read owner-authorized Quark diagnostic
        run: |
          python3 - <<'PY'
          import json,os,time,subprocess,urllib.error,urllib.parse,urllib.request
          audience='map7e-quark-readonly-diag-20261008'
          issuer_url=os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']+'&audience='+urllib.parse.quote(audience)
          request=urllib.request.Request(issuer_url,headers={'Authorization':'Bearer '+os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
          with urllib.request.urlopen(request,timeout=20) as response:
              token=json.load(response)['value']
          url='https://quarkdiag-oct8-map7e-quark-media-gateway.map7e-cloud.workers.dev/'
          anonymous_request=urllib.request.Request(url,headers={'Accept':'application/json'})
          try:
              anonymous_response=urllib.request.urlopen(anonymous_request,timeout=20)
          except urllib.error.HTTPError as error:
              anonymous_response=error
          try:
              anonymous_body=json.loads(anonymous_response.read(65536))
              print(json.dumps({'anonymousHttp':anonymous_response.status,'anonymousKeys':sorted(anonymous_body.keys()),'anonymousError':anonymous_body.get('error') if isinstance(anonymous_body.get('error'),str) and all(c in 'abcdefghijklmnopqrstuvwxyz0123456789_-' for c in anonymous_body['error']) else None}))
          except (ValueError,UnicodeError):
              print(json.dumps({'anonymousHttp':anonymous_response.status,'anonymousJson':False}))
          request=urllib.request.Request(url,headers={'Authorization':'Bearer '+token,'Accept':'application/json'})
          try:
              try:
                  response=urllib.request.urlopen(request,timeout=120)
              except urllib.error.HTTPError as error:
                  response=error
              status=response.status
              print(json.dumps({'diagnosticHttp':status}))
              raw=response.read(65536)
              try:
                  body=json.loads(raw)
              except (ValueError,UnicodeError):
                  print(json.dumps({'responseReadable':False}))
                  raise SystemExit(1)
              print(json.dumps({'responseKeys':sorted(body.keys())}))
              allowed_cf={'error_code','error_name','error_category','owner_action_required','retryable','status'}
              cf_values={key:value for key,value in body.items() if key in allowed_cf and (isinstance(value,(bool,int)) or isinstance(value,str) and len(value)<100 and all(c in 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789_-. ' for c in value))}
              if cf_values: print(json.dumps({'cloudflareResponse':cf_values}))
              curl_result=subprocess.run(['curl','-sS','--max-time','20',url],capture_output=True)
              try:
                  curl_body=json.loads(curl_result.stdout)
                  curl_safe={key:value for key,value in curl_body.items() if key in allowed_cf and (isinstance(value,(bool,int)) or isinstance(value,str) and len(value)<100 and all(c in 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789_-. ' for c in value))}
                  print(json.dumps({'anonymousCurlExit':curl_result.returncode,'anonymousCurlKeys':sorted(curl_body.keys()),'anonymousCurlCf':curl_safe,'anonymousCurlError':curl_body.get('error') if isinstance(curl_body.get('error'),str) and all(c in 'abcdefghijklmnopqrstuvwxyz0123456789_-' for c in curl_body['error']) else None}))
              except (ValueError,UnicodeError):
                  print(json.dumps({'anonymousCurlExit':curl_result.returncode,'anonymousCurlJson':False}))
              if body.get('diagnostic')!='quark-readonly-v1':
                  error=body.get('error')
                  if isinstance(error,str) and len(error)<100 and all(character in 'abcdefghijklmnopqrstuvwxyz0123456789_-' for character in error):
                      print(json.dumps({'diagnosticError':error}))
                  raise SystemExit(1)
              allowed={'sample','stage','variant','upstreamStatus','upstreamErrno','upstreamApiStatus','hasDownloadUrl','upstreamReason','upstreamLimitBytes','upstreamRequestId','clientTokenPresent','fileSize','errorCode','found'}
              for observation in body.get('observations',[]):
                  print(json.dumps({key:value for key,value in observation.items() if key in allowed},ensure_ascii=False))
              for key in ['failureType','errorCode']:
                  if key in body: print(json.dumps({key:body[key]}))
              if status!=200: raise SystemExit(1)
          finally:
              token=None
              request=None
          PY
