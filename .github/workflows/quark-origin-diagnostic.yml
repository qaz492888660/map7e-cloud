name: Temporary Quark origin diagnostic
on:
  push:
    branches: [feat/quark-media-gateway]
    paths: [.github/workflows/quark-origin-diagnostic.yml]
permissions:
  contents: read
  id-token: write
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read owner-authorized Quark diagnostic
        run: |
          python3 - <<'PY'
          import json,os,re,subprocess,urllib.parse,urllib.request
          audience='map7e-quark-readonly-diag-20261008'
          issuer_url=os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']+'&audience='+urllib.parse.quote(audience)
          issuer_request=urllib.request.Request(issuer_url,headers={'Authorization':'Bearer '+os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
          with urllib.request.urlopen(issuer_request,timeout=20) as response:
              token=json.load(response)['value']
          if not re.fullmatch(r'[A-Za-z0-9_.-]{40,12000}',token): raise SystemExit(1)
          url='https://quarkdiag-oct8-map7e-quark-media-gateway.map7e-cloud.workers.dev/'
          config='url="'+url+'"\nheader="Authorization: Bearer '+token+'"\nheader="Accept: application/json"\n'
          try:
              result=subprocess.run(['curl','-sS','--max-time','120','--config','-','-w','\n%{http_code}'],input=config.encode(),capture_output=True)
              print(json.dumps({'curlExit':result.returncode}))
              if result.returncode: raise SystemExit(1)
              raw,status=result.stdout.rsplit(b'\n',1)
              status=int(status)
              print(json.dumps({'diagnosticHttp':status}))
              try:
                  body=json.loads(raw)
              except (ValueError,UnicodeError):
                  print(json.dumps({'responseReadable':False}))
                  raise SystemExit(1)
              if body.get('diagnostic')!='quark-readonly-v1':
                  error=body.get('error')
                  if isinstance(error,str) and re.fullmatch(r'[a-z0-9_-]{1,100}',error): print(json.dumps({'diagnosticError':error}))
                  for key in ['error_code','error_name','error_category','owner_action_required']:
                      value=body.get(key)
                      if isinstance(value,(int,bool)) or isinstance(value,str) and re.fullmatch(r'[a-z0-9_-]{1,100}',value): print(json.dumps({key:value}))
                  raise SystemExit(1)
              allowed={'sample','stage','variant','upstreamStatus','upstreamErrno','upstreamApiStatus','hasDownloadUrl','upstreamReason','upstreamLimitBytes','upstreamRequestId','clientTokenPresent','fileSize','errorCode','found'}
              for observation in body.get('observations',[]):
                  print(json.dumps({key:value for key,value in observation.items() if key in allowed},ensure_ascii=False))
              for key in ['failureType','errorCode']:
                  if key in body: print(json.dumps({key:body[key]}))
              if status!=200: raise SystemExit(1)
          finally:
              token=None
              config=None
              issuer_request=None
          PY
