<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Map7e - Cloud</title>
    <link rel="icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="/assets/tailwind.config.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      html,
      body,
      #app {
        height: 100%;
        margin: 0;
      }

      :root {
        --page-background:
          linear-gradient(rgba(0, 0, 0, 0.25), rgba(0, 0, 0, 0.35)),
          url("https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=4096&q=100");
      }

      body {
        background-color: #0f172a;
        background-image: var(--page-background);
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;
        color: #fff;
      }

      .ocean-scene > div:first-child {
        background-image: var(--page-background) !important;
      }

      #bg-switch {
        position: fixed;
        right: 20px;
        bottom: 20px;
        z-index: 999;
        padding: 10px 14px;
        border-radius: 12px;
        background: rgba(0, 0, 0, 0.4);
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(10px);
        cursor: pointer;
        transition: all .3s;
      }

      #bg-switch:hover {
        background: rgba(255, 255, 255, 0.2);
      }
    </style>
  </head>
  <body>
    <button id="bg-switch">切换背景</button>
    <div id="app"></div>
    <script type="module" src="/assets/app.js"></script>
    <script>
      const bgList = [
        "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=4096&q=100",
        "https://images.unsplash.com/photo-1500375592092-40eb2168fd21?auto=format&fit=crop&w=4096&q=100",
        "https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=4096&q=100"
      ];

      let index = 0;

      function setBg(i) {
        const background =
          "linear-gradient(rgba(0,0,0,0.25), rgba(0,0,0,0.35)), url(" + bgList[i] + ")";
        document.documentElement.style.setProperty("--page-background", background);
        document.body.style.backgroundImage = background;
      }

      document.getElementById("bg-switch").onclick = () => {
        index = (index + 1) % bgList.length;
        setBg(index);
      };

      setBg(index);
    </script>
  </body>
  </html>
