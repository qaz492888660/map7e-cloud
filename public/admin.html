<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07131f" />
    <meta name="robots" content="noindex, nofollow" />
    <title>管理后台 · Map7e Cloud</title>
    <link rel="stylesheet" href="/assets/admin.css" />
  </head>
  <body>
    <main class="admin-shell">
      <header class="admin-header">
        <div>
          <p class="eyebrow">MAP7E CLOUD</p>
          <h1>管理后台</h1>
        </div>
        <a class="quiet-link" href="/">返回网盘</a>
      </header>

      <p id="notice" class="notice" role="status" hidden></p>

      <section id="login-panel" class="panel login-panel" hidden>
        <h2>管理员登录</h2>
        <p class="muted">使用独立的管理后台密码。网盘访客密码不能代替管理员认证。</p>
        <form id="login-form" class="stack">
          <label for="admin-password">管理员密码</label>
          <input id="admin-password" name="password" type="password" autocomplete="current-password" required />
          <button class="primary-button" type="submit">登录</button>
        </form>
      </section>

      <div id="dashboard" hidden>
        <section class="panel global-panel" aria-labelledby="global-heading">
          <div class="section-heading">
            <div>
              <p class="eyebrow">ACCESS POLICY</p>
              <h2 id="global-heading">全局设置</h2>
            </div>
            <button id="logout-button" class="quiet-button" type="button">退出管理</button>
          </div>
          <div class="global-control">
            <label for="global-access">网盘访问</label>
            <select id="global-access">
              <option value="public">公开</option>
              <option value="locked">上锁</option>
            </select>
            <button id="save-global" class="primary-button" type="button">保存全局设置</button>
          </div>
          <p class="muted">上锁后，继承权限的目录和文件需要使用现有云盘密码登录。公开目录可以覆盖上级锁定。</p>
        </section>

        <section class="folder-section" aria-labelledby="folders-heading">
          <div class="section-heading folder-heading">
            <div>
              <p class="eyebrow">PIKPAK FOLDERS</p>
              <h2 id="folders-heading">文件夹管理</h2>
              <p id="folder-summary" class="muted"></p>
            </div>
            <button id="refresh-folders" class="quiet-button" type="button">重新读取</button>
          </div>
          <div id="folder-list" class="folder-list"></div>
        </section>
      </div>
    </main>
    <script type="module" src="/assets/admin.js"></script>
  </body>
</html>
